<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小景的学术空间</title>
    <style>
        :root {
            --primary-green: #f2f9f2;
            --accent-green: #4CAF50;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --text-main: #333;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9f5e9 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app { width: 100%; max-width: 1000px; }

        /* 顶部欢迎语 */
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-weight: 300; font-size: 2.2rem; color: var(--accent-green); margin: 10px 0; }
        .header p { color: #888; letter-spacing: 1px; }

        /* 布局：左边文献，右边碎片 */
        .main-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; } }

        /* 通用卡片样式 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: var(--shadow);
            padding: 20px;
        }

        h2 { font-weight: 400; font-size: 1.1rem; border-bottom: 2px solid var(--accent-green); display: inline-block; padding-bottom: 5px; margin-bottom: 20px; }

        /* 文献列表样式 */
        .note-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .note-item:hover { transform: translateX(5px); }

        /* 碎片/便利贴样式 */
        .fragment-input-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .fragment-input-area input { padding: 10px; border-radius: 8px; border: 1px solid #ddd; outline: none; }
        
        .fragments-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .fragment-card {
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-green);
            font-size: 0.9rem;
            position: relative;
        }
        .fragment-card b { color: var(--accent-green); display: block; margin-bottom: 4px; }
        .delete-btn { color: #ccc; cursor: pointer; font-size: 0.8rem; position: absolute; top: 10px; right: 10px; }
        .delete-btn:hover { color: #ff6b6b; }

        /* 按钮样式 */
        .btn-main {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .btn-main:hover { opacity: 0.9; transform: scale(1.02); }

        /* 编辑器视图 (与之前逻辑一致) */
        #editorView { display: none; background: white; padding: 40px; border-radius: 20px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-green); }
        .form-group textarea, .form-group input { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 8px; box-sizing: border-box; }
        .editor-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: var(--accent-green); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-back { background: #eee; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }

        /* 打印/PDF 隐藏不需要的部分 */
        @media print { .header, .main-layout, .editor-btns { display: none !important; } #editorView { display: block !important; } }
    </style>
</head>
<body>

<div id="app">
    <div id="homeView">
        <div class="header">
            <h1>Hi，小景！</h1>
            <p>行在今日，实事求是。</p>
        </div>

        <div class="main-layout">
            <div class="glass-card">
                <h2>文献文件夹</h2>
                <button class="btn-main" onclick="openEditor()">+ 点击研读新文献</button>
                <div id="noteList">
                    </div>
            </div>

            <div class="glass-card">
                <h2>碎片实验室 (词汇/概念)</h2>
                <div class="fragment-input-area">
                    <input type="text" id="fragTitle" placeholder="概念名称 (如: 沉没成本)">
                    <input type="text" id="fragContent" placeholder="一句话解释...">
                    <button class="btn-save" onclick="addFragment()">顺手记下</button>
                </div>
                <div class="fragments-grid" id="fragmentList">
                    </div>
            </div>
        </div>
    </div>

    <div id="editorView">
        <h2 id="editHeader">新文献研读</h2>
        <div class="form-group"><label>文献标题</label><input type="text" id="title"></div>
        <div class="form-group"><label>【研究问题】</label><textarea id="q1"></textarea></div>
        <div class="form-group"><label>【看似显然 vs 实际发现】</label><textarea id="q2"></textarea></div>
        <div class="form-group"><label>【关键机制】</label><textarea id="q3"></textarea></div>
        <div class="form-group"><label>【方法亮点】</label><textarea id="q4"></textarea></div>
        <div class="form-group"><label>【我的疑问/延伸思考】</label><textarea id="q5"></textarea></div>
        <div class="form-group"><label>倒逼输出 (小红书/感悟)</label><textarea id="output" style="height:120px; border:1px dashed #4CAF50;"></textarea></div>
        
        <div class="editor-btns">
            <button class="btn-save" onclick="saveNote()">保存并归档</button>
            <button class="btn-back" onclick="window.print()">导出 PDF</button>
            <button class="btn-back" onclick="closeEditor()">返回</button>
        </div>
    </div>
</div>

<script>
    // --- 文献逻辑 ---
    function openEditor() {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('editorView').style.display = 'block';
    }

    function closeEditor() {
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('editorView').style.display = 'none';
    }

    function saveNote() {
        const note = {
            id: Date.now(),
            title: document.getElementById('title').value || '无标题',
            content: { 
                q1: document.getElementById('q1').value, 
                q2: document.getElementById('q2').value,
                q3: document.getElementById('q3').value,
                q4: document.getElementById('q4').value,
                q5: document.getElementById('q5').value,
                output: document.getElementById('output').value
            },
            date: new Date().toLocaleDateString()
        };
        let notes = JSON.parse(localStorage.getItem('myAcademicNotes') || '[]');
        notes.unshift(note);
        localStorage.setItem('myAcademicNotes', JSON.stringify(notes));
        renderAll();
        closeEditor();
    }

    // --- 碎片逻辑 ---
    function addFragment() {
        const t = document.getElementById('fragTitle').value;
        const c = document.getElementById('fragContent').value;
        if(!t) return alert("请输入概念名称");
        
        let frags = JSON.parse(localStorage.getItem('myAcademicFrags') || '[]');
        frags.unshift({ id: Date.now(), title: t, content: c });
        localStorage.setItem('myAcademicFrags', JSON.stringify(frags));
        
        document.getElementById('fragTitle').value = '';
        document.getElementById('fragContent').value = '';
        renderAll();
    }

    function deleteFrag(id) {
        let frags = JSON.parse(localStorage.getItem('myAcademicFrags') || '[]');
        frags = frags.filter(f => f.id !== id);
        localStorage.setItem('myAcademicFrags', JSON.stringify(frags));
        renderAll();
    }

    function deleteNote(id) {
        if(!confirm("确定删除这篇笔记吗？")) return;
        let notes = JSON.parse(localStorage.getItem('myAcademicNotes') || '[]');
        notes = notes.filter(n => n.id !== id);
        localStorage.setItem('myAcademicNotes', JSON.stringify(notes));
        renderAll();
    }

    // --- 渲染 ---
    function renderAll() {
        // 渲染文献
        const noteList = document.getElementById('noteList');
        const notes = JSON.parse(localStorage.getItem('myAcademicNotes') || '[]');
        noteList.innerHTML = notes.map(n => `
            <div class="note-item">
                <div><b>${n.title}</b><br><small style="color:#aaa">${n.date}</small></div>
                <span onclick="deleteNote(${n.id})" style="color:#ccc; cursor:pointer">删除</span>
            </div>
        `).join('');

        // 渲染碎片
        const fragList = document.getElementById('fragmentList');
        const frags = JSON.parse(localStorage.getItem('myAcademicFrags') || '[]');
        fragList.innerHTML = frags.map(f => `
            <div class="fragment-card">
                <span class="delete-btn" onclick="deleteFrag(${f.id})">×</span>
                <b>${f.title}</b>
                <div>${f.content}</div>
            </div>
        `).join('');
    }

    window.onload = renderAll;
</script>
</body>
</html>
